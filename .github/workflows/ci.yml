name: CI

on:
  push:
    branches: [main, feature/serial-ble-c3-s3]
  pull_request:

jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests (simulator, unsigned)
        run: |
          sim=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+[A-Za-z ]*\(' | head -1 | sed 's/ ($//')
          echo "simulator: $sim"
          xcodebuild test -scheme IPhoneAgent -destination "platform=iOS Simulator,name=$sim" \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Build
        run: hardware/flash.sh --build-only
      - name: Host tests (bplist, GOP buffer)
        run: make -C hardware/tests

  serial-ble:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [esp32c3, esp32s3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.18
      - name: Shared parser and state-machine behavior
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic hardware/serial_ble/tests/test_protocol.cpp -o /tmp/test-serial-ble
          /tmp/test-serial-ble
      - name: Compile only (never flash)
        run: python -m platformio run --project-dir hardware/serial_ble -e ${{ matrix.board }}

  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.24
      - name: Regenerate public-index lock
        run: uv lock --project server --default-index https://pypi.org/simple
      - uses: actions/upload-artifact@v4
        with:
          name: server-dependency-lock
          path: server/uv.lock
      - name: Check committed lock is current
        run: git diff --exit-code -- server/uv.lock

  server:  # legacy TCP default plus opt-in serial transport
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,serial]"
      - run: ruff check .
      - run: pytest -q
